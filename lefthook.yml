# Lefthook Git Hooks Configuration
# Refer to https://github.com/evilmartians/lefthook for documentation

pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun x --bun @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: drizzle-check
      run: bun run db:check
    - name: tests
      run: bun test
