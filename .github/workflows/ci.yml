name: ci

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint & format)
        run: bun x --bun @biomejs/biome ci .

      - name: Drizzle Schema Check
        run: bun run db:check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      BETTER_AUTH_SECRET: ci-secret-key-that-is-at-least-32-chars-long
      BETTER_AUTH_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: devsecret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test
